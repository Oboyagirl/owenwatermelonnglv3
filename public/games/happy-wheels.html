<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Wheels - Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
    #loading-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #fff;
      z-index: 20;
      gap: 14px;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .hw-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: hw-spin 0.8s linear infinite;
    }
    @keyframes hw-spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.02em;
    }
    #loading-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    #controls-bar {
      position: absolute;
      bottom: 8px;
      right: 8px;
      z-index: 30;
      display: flex;
      gap: 6px;
      opacity: 0.3;
      transition: opacity 0.2s;
    }
    #controls-bar:hover {
      opacity: 1;
    }
    .hw-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .hw-btn:hover {
      background: rgba(16, 185, 129, 0.8);
      border-color: #10b981;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="hw-spinner"></div>
    <div id="loading-text">Loading Happy Wheels...</div>
    <div id="loading-sub">Connecting to unblocked runner</div>
  </div>

  <iframe
    id="game-frame"
    src="https://gameinclassroom.github.io/happy-wheels/"
    allow="autoplay; fullscreen; focus-without-user-activation *; gamepad; keyboard-map *; accelerometer; gyroscope"
    allowfullscreen
  ></iframe>

  <div id="controls-bar">
    <button class="hw-btn" onclick="reloadHappyWheels()">↺ Reload</button>
    <button class="hw-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

  <script>
    const frame = document.getElementById('game-frame');
    const loader = document.getElementById('loading-container');

    frame.onload = function() {
      setTimeout(function() {
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() { loader.style.display = 'none'; }, 300);
        }
      }, 500);
    };

    // Safety timeout in case load event fires late
    setTimeout(function() {
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() { loader.style.display = 'none'; }, 300);
      }
    }, 4000);

    function reloadHappyWheels() {
      if (loader) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
      }
      frame.src = frame.src;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
      } else {
        document.exitFullscreen().catch(function() {});
      }
    }
  </script>
</body>
</html>
