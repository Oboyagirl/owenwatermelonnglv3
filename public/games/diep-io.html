<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diep.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #b5b5b5; font-family: -apple-system, BlinkMacSystemFont, "Ubuntu", Roboto, sans-serif;
    }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #cdcdcd; }

    /* Top Leaderboard */
    #leaderboard {
      position: absolute; top: 12px; right: 12px;
      width: 180px; background: rgba(0, 0, 0, 0.4);
      border-radius: 6px; padding: 8px 10px; color: #fff;
      font-size: 11px; z-index: 10; pointer-events: none;
    }
    .lb-header { text-align: center; font-weight: bold; margin-bottom: 6px; letter-spacing: 1px; color: #fff; }
    .lb-row { display: flex; justify-content: space-between; margin-bottom: 3px; font-weight: 600; }
    .lb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
    .lb-score { font-family: monospace; }

    /* Bottom XP Bar & Level */
    #bottom-hud {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      z-index: 10; pointer-events: none;
    }
    .level-label { font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .xp-bar-wrap {
      width: 320px; height: 16px; background: rgba(0,0,0,0.5);
      border: 2px solid #555; border-radius: 10px; overflow: hidden;
      position: relative;
    }
    .xp-bar-fill {
      height: 100%; width: 0%; background: #ffd700;
      transition: width 0.1s ease;
    }
    .xp-bar-text {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: bold; color: #222;
    }

    /* Stat Upgrades Sidebar */
    #stat-upgrades {
      position: absolute; bottom: 40px; left: 16px;
      display: flex; flex-direction: column; gap: 4px;
      z-index: 10;
    }
    .stat-upgrade-card {
      display: flex; align-items: center; background: rgba(0,0,0,0.45);
      border-radius: 5px; padding: 2px 6px; cursor: pointer; gap: 8px;
      color: #fff; font-size: 11px; font-weight: bold; transition: background 0.15s;
    }
    .stat-upgrade-card:hover { background: rgba(0,0,0,0.7); }
    .stat-bar-units { display: flex; gap: 2px; }
    .stat-unit { width: 10px; height: 12px; background: #555; border-radius: 2px; }
    .stat-unit.filled { background: #00e676; }

    /* Class selection menu */
    #class-menu {
      position: absolute; top: 16px; left: 16px;
      display: none; flex-direction: row; gap: 8px; z-index: 15;
    }
    .class-btn {
      background: rgba(0, 180, 255, 0.9); border: 2px solid #fff;
      color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: bold;
      font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .class-btn:hover { background: #0091ea; }

    /* Minimap */
    #minimap {
      position: absolute; bottom: 14px; right: 14px;
      width: 100px; height: 100px; background: rgba(0,0,0,0.35);
      border: 2px solid #555; border-radius: 4px; z-index: 10;
      pointer-events: none;
    }

    /* Start / Respawn Screen */
    #start-screen {
      position: absolute; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 50; color: #fff;
    }
    .game-logo { font-size: 44px; font-weight: 900; color: #00b0ff; text-shadow: 0 4px 14px rgba(0,176,255,0.4); }
    .name-input {
      background: #fff; border: 2px solid #00b0ff; border-radius: 6px;
      padding: 10px 18px; font-size: 16px; font-weight: bold; text-align: center;
      outline: none; width: 260px;
    }
    .btn-play {
      background: #00e676; border: none; border-radius: 6px;
      padding: 10px 32px; font-size: 16px; font-weight: bold; color: #111;
      cursor: pointer; box-shadow: 0 4px 12px rgba(0,230,118,0.4);
      transition: transform 0.1s;
    }
    .btn-play:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="diep-canvas"></canvas>

    <div id="leaderboard">
      <div class="lb-header">Scoreboard</div>
      <div id="lb-entries"></div>
    </div>

    <div id="class-menu"></div>

    <div id="stat-upgrades"></div>

    <div id="bottom-hud">
      <div class="level-label" id="level-text">Tank: Level 1</div>
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" id="xp-fill"></div>
        <div class="xp-bar-text" id="xp-text">0 / 100 XP</div>
      </div>
      <div style="font-size: 10px; color: #ddd; text-shadow: 0 1px 2px #000;">[E] Auto-Fire · [C] Auto-Spin · Upgrade Stats 1-8</div>
    </div>

    <canvas id="minimap"></canvas>

    <div id="start-screen">
      <div class="game-logo">diep.io</div>
      <div style="font-size: 13px; color: #cbd5e1;">Shoot shapes, defeat rival tanks, evolve your build!</div>
      <input type="text" class="name-input" id="player-nickname" placeholder="Enter Tank Name" maxlength="15" value="SniperAce">
      <button class="btn-play" id="btn-start">SPAWN TANK</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('diep-canvas');
    const ctx = canvas.getContext('2d');
    const minimap = document.getElementById('minimap');
    const mCtx = minimap.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      minimap.width = 100;
      minimap.height = 100;
    }
    window.addEventListener('resize', resize);
    resize();

    // Map bounds
    const MAP_SIZE = 3500;
    let camera = { x: 0, y: 0 };
    let mouse = { x: 0, y: 0, worldX: 0, worldY: 0, isDown: false };
    let autoFire = false;
    let autoSpin = false;
    let autoSpinAngle = 0;

    // Stat definitions
    const STATS = [
      { id: 'regen', name: 'Health Regen', max: 7, level: 0, color: '#f59e0b' },
      { id: 'health', name: 'Max Health', max: 7, level: 0, color: '#f43f5e' },
      { id: 'bodyDmg', name: 'Body Damage', max: 7, level: 0, color: '#8b5cf6' },
      { id: 'bulletSpd', name: 'Bullet Speed', max: 7, level: 0, color: '#0ea5e9' },
      { id: 'bulletPen', name: 'Bullet Penetration', max: 7, level: 0, color: '#eab308' },
      { id: 'bulletDmg', name: 'Bullet Damage', max: 7, level: 0, color: '#ef4444' },
      { id: 'reload', name: 'Reload', max: 7, level: 0, color: '#10b981' },
      { id: 'moveSpd', name: 'Movement Speed', max: 7, level: 0, color: '#06b6d4' }
    ];

    let statPoints = 0;

    // Player Tank
    let player = {
      name: 'Tank',
      x: MAP_SIZE / 2,
      y: MAP_SIZE / 2,
      vx: 0,
      vy: 0,
      radius: 20,
      angle: 0,
      color: '#00b0ff',
      health: 100,
      maxHealth: 100,
      score: 0,
      level: 1,
      tankClass: 'basic', // basic, twin, sniper, machineGun, flankGuard, destroyer, tripleShot, octoTank
      reloadTimer: 0,
      isAlive: false
    };

    let bullets = [];
    let shapes = [];
    let bots = [];

    // Shapes: Yellow squares, Red triangles, Blue pentagons, Alpha Pentagons
    function spawnShapes(count = 250) {
      for (let i = 0; i < count; i++) {
        const typeRoll = Math.random();
        let type = 'square';
        let radius = 14;
        let hp = 10;
        let xp = 10;
        let color = '#ffe869';

        if (typeRoll < 0.15) {
          type = 'pentagon';
          radius = 24;
          hp = 100;
          xp = 130;
          color = '#768dfc';
        } else if (typeRoll < 0.45) {
          type = 'triangle';
          radius = 16;
          hp = 30;
          xp = 25;
          color = '#fc7677';
        }

        shapes.push({
          x: Math.random() * (MAP_SIZE - 200) + 100,
          y: Math.random() * (MAP_SIZE - 200) + 100,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          angle: Math.random() * Math.PI * 2,
          angularSpeed: (Math.random() - 0.5) * 0.02,
          radius,
          type,
          health: hp,
          maxHealth: hp,
          xp,
          color
        });
      }

      // Add center Alpha Pentagon
      shapes.push({
        x: MAP_SIZE / 2,
        y: MAP_SIZE / 2,
        vx: 0, vy: 0, angle: 0, angularSpeed: 0.005,
        radius: 70, type: 'pentagon',
        health: 2500, maxHealth: 2500, xp: 3000,
        color: '#5b76fc'
      });
    }

    // Spawn AI Bots
    const BOT_NAMES = ['ProSlayer', 'Dreadnought', 'Vortex', 'Hexagon', 'Shadow', 'Falcon', 'Overlord', 'Annihilator'];
    function spawnBots(count = 12) {
      for (let i = 0; i < count; i++) {
        bots.push({
          name: BOT_NAMES[i % BOT_NAMES.length],
          x: Math.random() * MAP_SIZE,
          y: Math.random() * MAP_SIZE,
          vx: 0,
          vy: 0,
          radius: 20,
          angle: Math.random() * Math.PI * 2,
          color: '#f04f54', // Red team enemy
          health: 120,
          maxHealth: 120,
          score: Math.floor(Math.random() * 4000) + 200,
          tankClass: ['basic', 'twin', 'sniper', 'machineGun', 'flankGuard'][Math.floor(Math.random() * 5)],
          reloadTimer: 0,
          targetX: MAP_SIZE / 2,
          targetY: MAP_SIZE / 2,
          changeDirTimer: 0
        });
      }
    }

    spawnShapes();
    spawnBots();

    // Mouse & Keyboard Inputs
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.worldX = mouse.x + camera.x;
      mouse.worldY = mouse.y + camera.y;
    });
    window.addEventListener('mousedown', e => { if (e.button === 0) mouse.isDown = true; });
    window.addEventListener('mouseup', e => { if (e.button === 0) mouse.isDown = false; });

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'e') autoFire = !autoFire;
      if (e.key.toLowerCase() === 'c') autoSpin = !autoSpin;
      if (e.key >= '1' && e.key <= '8') {
        const idx = parseInt(e.key) - 1;
        upgradeStat(idx);
      }
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function upgradeStat(idx) {
      if (statPoints > 0 && STATS[idx] && STATS[idx].level < STATS[idx].max) {
        STATS[idx].level++;
        statPoints--;
        renderStatsUI();
      }
    }

    function renderStatsUI() {
      const container = document.getElementById('stat-upgrades');
      container.innerHTML = '';
      if (statPoints <= 0) return;

      STATS.forEach((s, idx) => {
        if (s.level >= s.max) return;
        const card = document.createElement('div');
        card.className = 'stat-upgrade-card';
        card.innerHTML = `
          <span>[${idx+1}] ${s.name}</span>
          <div class="stat-bar-units">
            ${Array.from({ length: s.max }).map((_, i) => `<div class="stat-unit ${i < s.level ? 'filled' : ''}"></div>`).join('')}
          </div>
        `;
        card.onclick = () => upgradeStat(idx);
        container.appendChild(card);
      });
    }

    // Class evolution upgrade menu
    function checkClassUpgrade() {
      const menu = document.getElementById('class-menu');
      if (player.level >= 15 && player.tankClass === 'basic') {
        menu.style.display = 'flex';
        menu.innerHTML = `
          <button class="class-btn" onclick="selectClass('twin')">Twin</button>
          <button class="class-btn" onclick="selectClass('sniper')">Sniper</button>
          <button class="class-btn" onclick="selectClass('machineGun')">Machine Gun</button>
          <button class="class-btn" onclick="selectClass('flankGuard')">Flank Guard</button>
        `;
      } else if (player.level >= 30 && ['twin', 'sniper', 'machineGun', 'flankGuard'].includes(player.tankClass)) {
        menu.style.display = 'flex';
        menu.innerHTML = `
          <button class="class-btn" onclick="selectClass('tripleShot')">Triple Shot</button>
          <button class="class-btn" onclick="selectClass('destroyer')">Destroyer</button>
          <button class="class-btn" onclick="selectClass('octoTank')">Octo Tank</button>
        `;
      } else {
        menu.style.display = 'none';
      }
    }
    window.selectClass = function(c) {
      player.tankClass = c;
      document.getElementById('class-menu').style.display = 'none';
    };

    // XP & Level calculations
    function addScore(amount) {
      player.score += amount;
      const prevLvl = player.level;
      player.level = Math.min(45, Math.floor(1 + Math.sqrt(player.score / 60)));
      if (player.level > prevLvl) {
        statPoints += (player.level - prevLvl);
        renderStatsUI();
        checkClassUpgrade();
      }
      updateXPUI();
    }

    function updateXPUI() {
      const curLvlXp = Math.pow(player.level - 1, 2) * 60;
      const nextLvlXp = Math.pow(player.level, 2) * 60;
      const progress = Math.min(100, Math.max(0, ((player.score - curLvlXp) / (nextLvlXp - curLvlXp)) * 100));
      document.getElementById('xp-fill').style.width = `${progress}%`;
      document.getElementById('xp-text').textContent = `${player.score} Score`;
      document.getElementById('level-text').textContent = `Lvl ${player.level} ${player.tankClass.toUpperCase()}`;
    }

    // Fire bullets from tank based on barrel configuration
    function fireTank(t, isPlayer = false) {
      const bulletSpeed = (isPlayer ? (8 + STATS[3].level * 1.2) : 8);
      const bulletDamage = (isPlayer ? (12 + STATS[5].level * 4) : 14);
      const bulletPen = (isPlayer ? (1 + STATS[4].level * 0.8) : 1.5);
      const color = t.color;

      const shoot = (angleOffset = 0, barrelDist = 26, bRadius = 8) => {
        const bAngle = t.angle + angleOffset;
        bullets.push({
          x: t.x + Math.cos(bAngle) * barrelDist,
          y: t.y + Math.sin(bAngle) * barrelDist,
          vx: Math.cos(bAngle) * bulletSpeed,
          vy: Math.sin(bAngle) * bulletSpeed,
          radius: bRadius,
          damage: bulletDamage,
          penetration: bulletPen,
          owner: isPlayer ? 'player' : t.name,
          color,
          life: 180
        });
      };

      if (t.tankClass === 'twin') {
        shoot(0.12); shoot(-0.12);
      } else if (t.tankClass === 'sniper') {
        shoot(0, 36, 9);
      } else if (t.tankClass === 'machineGun') {
        shoot((Math.random() - 0.5) * 0.4, 26, 7);
      } else if (t.tankClass === 'flankGuard') {
        shoot(0); shoot(Math.PI);
      } else if (t.tankClass === 'destroyer') {
        shoot(0, 34, 18);
      } else if (t.tankClass === 'tripleShot') {
        shoot(0); shoot(-0.4); shoot(0.4);
      } else if (t.tankClass === 'octoTank') {
        for (let i = 0; i < 8; i++) shoot(i * (Math.PI / 4));
      } else {
        // Basic Tank
        shoot(0);
      }
    }

    // Start Game
    document.getElementById('btn-start').addEventListener('click', () => {
      const nameInput = document.getElementById('player-nickname').value.trim();
      player.name = nameInput || 'Tank';
      player.x = MAP_SIZE / 2;
      player.y = MAP_SIZE / 2;
      player.health = 100;
      player.score = 0;
      player.level = 1;
      player.tankClass = 'basic';
      player.isAlive = true;
      statPoints = 0;
      STATS.forEach(s => s.level = 0);
      renderStatsUI();
      updateXPUI();
      document.getElementById('start-screen').style.display = 'none';
    });

    // --- Update & Loop ---
    let lastTime = performance.now();
    function update(dt) {
      if (!player.isAlive) return;

      // Handle Tank Movement
      const moveSpeed = (2.8 + STATS[7].level * 0.4);
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071; dy *= 0.7071;
      }
      player.vx += dx * moveSpeed * 0.4;
      player.vy += dy * moveSpeed * 0.4;
      player.vx *= 0.88;
      player.vy *= 0.88;
      player.x += player.vx;
      player.y += player.vy;

      // Map bounds clamping
      player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.y));

      // Aiming
      if (autoSpin) {
        autoSpinAngle += 0.03;
        player.angle = autoSpinAngle;
      } else {
        player.angle = Math.atan2(mouse.worldY - player.y, mouse.worldX - player.x);
      }

      // Shooting
      const reloadRate = Math.max(6, 18 - STATS[6].level * 1.5);
      if (player.reloadTimer > 0) player.reloadTimer--;
      if ((mouse.isDown || autoFire) && player.reloadTimer <= 0) {
        fireTank(player, true);
        player.reloadTimer = reloadRate;
      }

      // Health Regen
      if (player.health < player.maxHealth) {
        player.health = Math.min(player.maxHealth, player.health + (0.04 + STATS[0].level * 0.08));
      }

      // Camera follows player
      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;
      mouse.worldX = mouse.x + camera.x;
      mouse.worldY = mouse.y + camera.y;

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0 || b.x < 0 || b.x > MAP_SIZE || b.y < 0 || b.y > MAP_SIZE) {
          bullets.splice(i, 1);
          continue;
        }

        // Check bullet vs Shapes
        for (let j = shapes.length - 1; j >= 0; j--) {
          const s = shapes[j];
          if (Math.hypot(b.x - s.x, b.y - s.y) < b.radius + s.radius) {
            s.health -= b.damage;
            b.penetration -= 1;
            if (b.penetration <= 0) {
              bullets.splice(i, 1);
              break;
            }
            if (s.health <= 0) {
              if (b.owner === 'player') addScore(s.xp);
              shapes.splice(j, 1);
              // Respawn shape elsewhere
              spawnShapes(1);
            }
          }
        }

        // Check bullet vs Bots
        for (let k = bots.length - 1; k >= 0; k--) {
          const bot = bots[k];
          if (b.owner === 'player' && Math.hypot(b.x - bot.x, b.y - bot.y) < b.radius + bot.radius) {
            bot.health -= b.damage;
            bullets.splice(i, 1);
            if (bot.health <= 0) {
              addScore(bot.score);
              bots.splice(k, 1);
              spawnBots(1);
            }
            break;
          }
        }

        // Check bullet vs Player
        if (b.owner !== 'player' && Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
          player.health -= b.damage;
          bullets.splice(i, 1);
          if (player.health <= 0) {
            player.isAlive = false;
            document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('btn-start').textContent = 'RESPAWN';
          }
        }
      }

      // Update AI Bots
      for (const bot of bots) {
        bot.changeDirTimer--;
        if (bot.changeDirTimer <= 0) {
          bot.targetX = Math.random() * MAP_SIZE;
          bot.targetY = Math.random() * MAP_SIZE;
          bot.changeDirTimer = 180 + Math.random() * 120;
        }
        const bdx = bot.targetX - bot.x;
        const bdy = bot.targetY - bot.y;
        const bAngle = Math.atan2(bdy, bdx);
        bot.vx += Math.cos(bAngle) * 0.4;
        bot.vy += Math.sin(bAngle) * 0.4;
        bot.vx *= 0.88;
        bot.vy *= 0.88;
        bot.x += bot.vx;
        bot.y += bot.vy;
        bot.angle = bAngle;

        // Bot shoots at nearby shapes or player
        bot.reloadTimer--;
        if (bot.reloadTimer <= 0 && Math.hypot(player.x - bot.x, player.y - bot.y) < 550) {
          bot.angle = Math.atan2(player.y - bot.y, player.x - bot.x);
          fireTank(bot, false);
          bot.reloadTimer = 35;
        }
      }

      // Update Shapes
      for (const s of shapes) {
        s.x += s.vx;
        s.y += s.vy;
        s.angle += s.angularSpeed;
        if (s.x < s.radius || s.x > MAP_SIZE - s.radius) s.vx *= -1;
        if (s.y < s.radius || s.y > MAP_SIZE - s.radius) s.vy *= -1;

        // Collision with player
        if (Math.hypot(player.x - s.x, player.y - s.y) < player.radius + s.radius) {
          const bodyDamage = (15 + STATS[2].level * 6);
          s.health -= bodyDamage;
          player.health -= 12;
          if (s.health <= 0) {
            addScore(s.xp);
            shapes.splice(shapes.indexOf(s), 1);
            spawnShapes(1);
          }
          if (player.health <= 0) {
            player.isAlive = false;
            document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('btn-start').textContent = 'RESPAWN';
          }
        }
      }
    }

    // Draw Barrel helper
    function drawBarrel(ctx, width, length, xOffset = 0, yOffset = 0) {
      ctx.fillStyle = '#999';
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 3;
      ctx.fillRect(xOffset, yOffset - width / 2, length, width);
      ctx.strokeRect(xOffset, yOffset - width / 2, length, width);
    }

    // Render Canvas
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      // 1. Draw Grid Lines
      ctx.strokeStyle = '#c0c0c0';
      ctx.lineWidth = 1;
      const gridSize = 32;
      const startX = Math.floor(camera.x / gridSize) * gridSize;
      const endX = camera.x + canvas.width;
      const startY = Math.floor(camera.y / gridSize) * gridSize;
      const endY = camera.y + canvas.height;

      ctx.beginPath();
      for (let x = startX; x <= endX; x += gridSize) {
        ctx.moveTo(x, startY); ctx.lineTo(x, endY);
      }
      for (let y = startY; y <= endY; y += gridSize) {
        ctx.moveTo(startX, y); ctx.lineTo(endX, y);
      }
      ctx.stroke();

      // 2. Draw Map Boundaries
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 6;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // 3. Draw Shapes
      for (const s of shapes) {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        ctx.fillStyle = s.color;
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;

        ctx.beginPath();
        if (s.type === 'square') {
          ctx.rect(-s.radius, -s.radius, s.radius * 2, s.radius * 2);
        } else if (s.type === 'triangle') {
          ctx.moveTo(s.radius, 0);
          ctx.lineTo(-s.radius, s.radius * 0.85);
          ctx.lineTo(-s.radius, -s.radius * 0.85);
          ctx.closePath();
        } else if (s.type === 'pentagon') {
          for (let p = 0; p < 5; p++) {
            const pAngle = p * (Math.PI * 2 / 5);
            const px = Math.cos(pAngle) * s.radius;
            const py = Math.sin(pAngle) * s.radius;
            if (p === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        }
        ctx.fill();
        ctx.stroke();

        // Health bar if damaged
        if (s.health < s.maxHealth) {
          ctx.rotate(-s.angle);
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(-s.radius, s.radius + 6, s.radius * 2, 4);
          ctx.fillStyle = '#00e676';
          ctx.fillRect(-s.radius, s.radius + 6, (s.health / s.maxHealth) * s.radius * 2, 4);
        }
        ctx.restore();
      }

      // 4. Draw Bullets
      for (const b of bullets) {
        ctx.fillStyle = b.color;
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // 5. Draw Bots
      for (const bot of bots) {
        drawTank(bot);
      }

      // 6. Draw Player Tank
      if (player.isAlive) {
        drawTank(player, true);
      }

      ctx.restore();

      // 7. Draw Minimap
      drawMinimap();
      updateLeaderboard();
    }

    function drawTank(t, isPlayer = false) {
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.rotate(t.angle);

      // Draw Barrels based on class
      if (t.tankClass === 'twin') {
        drawBarrel(ctx, 10, 32, 0, -6);
        drawBarrel(ctx, 10, 32, 0, 6);
      } else if (t.tankClass === 'sniper') {
        drawBarrel(ctx, 12, 42);
      } else if (t.tankClass === 'machineGun') {
        ctx.save();
        ctx.fillStyle = '#999'; ctx.strokeStyle = '#555'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -6); ctx.lineTo(34, -14); ctx.lineTo(34, 14); ctx.lineTo(0, 6);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      } else if (t.tankClass === 'flankGuard') {
        drawBarrel(ctx, 12, 32);
        drawBarrel(ctx, 12, 24, -24, 0);
      } else if (t.tankClass === 'destroyer') {
        drawBarrel(ctx, 22, 38);
      } else if (t.tankClass === 'tripleShot') {
        drawBarrel(ctx, 10, 30);
        ctx.save(); ctx.rotate(-0.45); drawBarrel(ctx, 10, 28); ctx.restore();
        ctx.save(); ctx.rotate(0.45); drawBarrel(ctx, 10, 28); ctx.restore();
      } else if (t.tankClass === 'octoTank') {
        for (let i = 0; i < 8; i++) {
          ctx.save(); ctx.rotate(i * (Math.PI / 4)); drawBarrel(ctx, 10, 30); ctx.restore();
        }
      } else {
        // Basic Tank
        drawBarrel(ctx, 12, 32);
      }

      // Tank Body Core
      ctx.fillStyle = t.color;
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.restore();

      // Nametag & Health Bar
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Ubuntu, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
      ctx.fillText(t.name, t.x, t.y - t.radius - 14);

      // Health Bar
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(t.x - 22, t.y - t.radius - 8, 44, 5);
      ctx.fillStyle = isPlayer ? '#00e676' : '#f04f54';
      ctx.fillRect(t.x - 22, t.y - t.radius - 8, Math.max(0, (t.health / t.maxHealth) * 44), 5);
      ctx.restore();
    }

    function drawMinimap() {
      mCtx.clearRect(0, 0, 100, 100);
      mCtx.fillStyle = '#cdcdcd';
      mCtx.fillRect(0, 0, 100, 100);

      // Center nest
      mCtx.fillStyle = 'rgba(91, 118, 252, 0.4)';
      mCtx.fillRect(40, 40, 20, 20);

      // Bots
      mCtx.fillStyle = '#f04f54';
      for (const b of bots) {
        mCtx.fillRect((b.x / MAP_SIZE) * 100 - 1.5, (b.y / MAP_SIZE) * 100 - 1.5, 3, 3);
      }

      // Player
      if (player.isAlive) {
        mCtx.fillStyle = '#00b0ff';
        mCtx.beginPath();
        mCtx.arc((player.x / MAP_SIZE) * 100, (player.y / MAP_SIZE) * 100, 3.5, 0, Math.PI * 2);
        mCtx.fill();
      }
    }

    function updateLeaderboard() {
      const allTanks = [...bots];
      if (player.isAlive) allTanks.push(player);
      allTanks.sort((a, b) => b.score - a.score);

      const entries = document.getElementById('lb-entries');
      entries.innerHTML = allTanks.slice(0, 6).map((t, idx) => `
        <div class="lb-row" style="color: ${t === player ? '#00e676' : '#fff'};">
          <span class="lb-name">${idx + 1}. ${t.name}</span>
          <span class="lb-score">${t.score}</span>
        </div>
      `).join('');
    }

    // State Persistence for Exact Time Checkpoint Cloud Saves
    function saveDiepState() {
      if (!player) return;
      try {
        const state = {
          player: {
            name: player.name,
            x: player.x,
            y: player.y,
            score: player.score,
            level: player.level,
            tankClass: player.tankClass,
            health: player.health,
            maxHealth: player.maxHealth,
            isAlive: player.isAlive
          },
          statUpgrades,
          statPoints,
          savedAt: Date.now()
        };
        localStorage.setItem('diepio_save_state', JSON.stringify(state));
      } catch(e) {}
    }

    function loadDiepState() {
      try {
        const raw = localStorage.getItem('diepio_save_state');
        if (!raw) return;
        const state = JSON.parse(raw);
        if (state && state.player) {
          Object.assign(player, state.player);
          if (Array.isArray(state.statUpgrades)) {
            state.statUpgrades.forEach((u, i) => {
              if (statUpgrades[i] && typeof u.level === 'number') {
                statUpgrades[i].level = u.level;
              }
            });
          }
          if (typeof state.statPoints === 'number') statPoints = state.statPoints;
          recalculateStats();
          renderStatsUI();
          updateLevelUI();
        }
      } catch(e) {}
    }

    // Auto-save every 2 seconds
    setInterval(saveDiepState, 2000);
    window.addEventListener('beforeunload', saveDiepState);

    // Listen for Cloud Save instant restore events
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'UNIVERSAL_GAME_RESTORE') {
        setTimeout(loadDiepState, 50);
      }
    });

    loadDiepState();

    function loop(now) {
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
