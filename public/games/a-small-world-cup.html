<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Small World Cup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe 
    id="game-frame"
    src="https://gameinclassroom.github.io/a-small-world-cup/" 
    allow="autoplay; fullscreen; focus-without-user-activation *; gamepad; keyboard-map *" 
    allowfullscreen>
  </iframe>
  <script>
    const iframe = document.getElementById('game-frame');
    let hasLoaded = false;
    iframe.addEventListener('load', () => { hasLoaded = true; });
    setTimeout(() => {
      if (!hasLoaded) {
        iframe.src = '/api/proxy/game?url=' + encodeURIComponent('https://gameinclassroom.github.io/a-small-world-cup/');
      }
    }, 3500);
  </script>
</body>
</html>
