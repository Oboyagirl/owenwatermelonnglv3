<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duck Life 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game-container, #ruffle-target {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ruffle-target"></div>
  </div>

  <script>
    const primarySwf = "swfs/ducklife4.swf";
    const remoteSwf = "https://ubghyper.github.io/GameList.github.io/Duck-Life-4/ducklife4.swf";
    const remoteEmbed = "https://ubghyper.github.io/GameList.github.io/Duck-Life-4/";

    let initialized = false;

    function fallbackToIframe() {
      if (initialized) return;
      initialized = true;
      const container = document.getElementById("game-container");
      if (container) {
        container.innerHTML = '<iframe src="' + remoteEmbed + '" allow="autoplay; fullscreen; focus-without-user-activation *; gamepad; keyboard-map *" allowfullscreen></iframe>';
      }
    }

    function initRuffle() {
      if (initialized) return true;
      try {
        if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== "function") {
          return false;
        }
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const target = document.getElementById("ruffle-target");
        if (!target) return false;
        target.innerHTML = "";
        target.appendChild(player);

        player.load({
          url: primarySwf,
          autoplay: "auto",
          backgroundColor: "#000000"
        }).then(function() {
          initialized = true;
        }).catch(function(e) {
          console.warn("Primary SWF load failed, retrying with remote mirror:", e);
          player.load({
            url: remoteSwf,
            autoplay: "auto",
            backgroundColor: "#000000"
          }).then(function() {
            initialized = true;
          }).catch(function() {
            fallbackToIframe();
          });
        });

        player.style.width = "100%";
        player.style.height = "100%";
        initialized = true;
        return true;
      } catch (err) {
        console.error("Ruffle init exception:", err);
        fallbackToIframe();
        return false;
      }
    }

    // Failover watchdog: if Ruffle does not load within 3.5s, switch to unblocked iframe mirror
    setTimeout(function() {
      if (!initialized) {
        fallbackToIframe();
      }
    }, 3500);

    function loadScript(src, onSuccess, onError) {
      const s = document.createElement("script");
      s.src = src;
      s.onload = onSuccess;
      s.onerror = onError;
      document.head.appendChild(s);
    }

    // Try relative local Ruffle first; then remote GitHub Pages mirror, then CDN
    loadScript("../ruffle/ruffle.js", function() {
      if (!initRuffle()) {
        setTimeout(initRuffle, 200);
      }
    }, function() {
      loadScript("https://ubghyper.github.io/GameList.github.io/ruffle/ruffle.js", function() {
        if (!initRuffle()) {
          setTimeout(initRuffle, 200);
        }
      }, function() {
        loadScript("https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js", function() {
          if (!initRuffle()) {
            setTimeout(initRuffle, 200);
          }
        }, function() {
          fallbackToIframe();
        });
      });
    });
  </script>
</body>
</html>
