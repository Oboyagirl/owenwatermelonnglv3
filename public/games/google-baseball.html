<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Google Baseball</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #4ade80;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #4ade80;
    }
    #loading-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14532d;
      color: #fff;
      z-index: 20;
      gap: 14px;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .bb-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: bb-spin 0.8s linear infinite;
    }
    @keyframes bb-spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 16px;
      font-weight: 700;
      color: #fef08a;
      letter-spacing: 0.04em;
    }
    #loading-sub {
      font-size: 12px;
      color: #bbf7d0;
    }
    #controls-bar {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 30;
      display: flex;
      gap: 6px;
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    #controls-bar:hover {
      opacity: 1;
    }
    .bb-btn {
      background: rgba(20, 83, 45, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .bb-btn:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="bb-spinner"></div>
    <div id="loading-text">Loading Google Baseball...</div>
    <div id="loading-sub">Step up to the plate!</div>
  </div>

  <iframe
    id="game-frame"
    src="https://7zeb.github.io/homework/googlebaseball.html"
    allow="autoplay; fullscreen; focus-without-user-activation *; gamepad; keyboard-map *; accelerometer; gyroscope"
    allowfullscreen
  ></iframe>

  <div id="controls-bar">
    <button class="bb-btn" onclick="reloadBaseball()">↺ Reload</button>
    <button class="bb-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

  <script>
    const frame = document.getElementById('game-frame');
    const loader = document.getElementById('loading-container');

    frame.onload = function() {
      setTimeout(function() {
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() { loader.style.display = 'none'; }, 300);
        }
      }, 500);
    };

    setTimeout(function() {
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() { loader.style.display = 'none'; }, 300);
      }
    }, 4000);

    function reloadBaseball() {
      if (loader) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
      }
      frame.src = frame.src;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
      } else {
        document.exitFullscreen().catch(function() {});
      }
    }
  </script>
</body>
</html>
