<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokemon Emerald</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #fff;
      z-index: 50;
      gap: 16px;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f1f5f9;
    }
    #loading-sub {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-title">Loading Pokemon Emerald...</div>
    <div id="loading-sub">Initializing GBA WebAssembly Engine & Save System</div>
  </div>
  <div id="game"></div>

  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'gba';
    window.EJS_gameUrl = 'https://freeonlinewebtools.github.io/gamelist3.github.io/pokemonemerald.gba';
    window.EJS_gameName = 'Pokemon Emerald';
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#10b981';
    window.EJS_pathtodata = 'https://cdn.jsdelivr.net/npm/@emulatorjs/emulatorjs@4.2.3/data/';
    window.EJS_paths = {
      'mgba-wasm.data': 'https://cdn.jsdelivr.net/npm/@emulatorjs/core-mgba@4.2.3/mgba-wasm.data',
      'mgba-legacy-wasm.data': 'https://cdn.jsdelivr.net/npm/@emulatorjs/core-mgba@4.2.3/mgba-legacy-wasm.data',
      'mgba-thread-wasm.data': 'https://cdn.jsdelivr.net/npm/@emulatorjs/core-mgba@4.2.3/mgba-thread-wasm.data',
      'mgba-thread-legacy-wasm.data': 'https://cdn.jsdelivr.net/npm/@emulatorjs/core-mgba@4.2.3/mgba-thread-legacy-wasm.data'
    };

    window.EJS_onGameStart = function() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 400);
      }
    };

    // Universal Save & Restore message listener for frame-accurate state loading
    window.addEventListener('message', async (e) => {
      if (e.data && (e.data.type === 'UNIVERSAL_GAME_RESTORE' || e.data.type === 'RESTORE_SAVE')) {
        const payload = e.data.payload || e.data;
        if (payload && payload.emulator && window.EJS_emulator && window.EJS_emulator.gameManager) {
          const gm = window.EJS_emulator.gameManager;
          if (payload.emulator.saveFileBase64 && gm.FS) {
            try {
              const bin = atob(payload.emulator.saveFileBase64);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              const path = typeof gm.getSaveFilePath === 'function' ? gm.getSaveFilePath() : null;
              if (path) {
                try { gm.FS.unlink(path); } catch (err) {}
                gm.FS.writeFile(path, bytes);
                if (typeof gm.loadSaveFiles === 'function') gm.loadSaveFiles();
              }
            } catch (err) {
              console.warn("Restore save file failed:", err);
            }
          }
          if (payload.emulator.stateBase64 && typeof gm.loadState === 'function') {
            try {
              const bin = atob(payload.emulator.stateBase64);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              gm.loadState(bytes);
            } catch (err) {
              console.warn("Restore state failed:", err);
            }
          }
        }
      }
    });

    setTimeout(() => {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 400);
      }
    }, 6000);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@emulatorjs/emulatorjs@4.2.3/data/loader.js"></script>
</body>
</html>
