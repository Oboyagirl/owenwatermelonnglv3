<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/dumb-ways-to-die@main/">
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dumb Ways To Die</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ruffle-player, object, embed {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      border: none !important;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      letterbox: "on",
      autoplay: "on",
      unmuteOverlay: "hidden",
      backgroundColor: "#000000",
      allowScriptAccess: true,
      warnOnUnsupportedContent: false,
      logLevel: "error",
      showSwfDownload: false
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
</head>
<body>
  <object width="100%" height="100%">
    <param name="movie" value="https://cdn.jsdelivr.net/gh/web-ports/dumb-ways-to-die@main/data/main.swf">
    <embed src="https://cdn.jsdelivr.net/gh/web-ports/dumb-ways-to-die@main/data/main.swf" width="100%" height="100%">
  </object>
</body>
</html>
