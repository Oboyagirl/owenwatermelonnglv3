<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watermelon Breakout - Owen Watermelon V3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #08160f;
      color: #f1f5f9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 480px;
      height: 520px;
      max-width: 95vw;
      background: #0c2016;
      border: 3px solid #16402a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    #header {
      height: 48px;
      background: rgba(8, 22, 15, 0.95);
      border-bottom: 2px solid #16402a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
    }
    .metric { display: flex; flex-direction: column; }
    .label { font-size: 10px; text-transform: uppercase; color: #6ee7b7; }
    .val { font-size: 16px; font-weight: 700; color: #fff; font-family: monospace; }
    canvas {
      flex: 1;
      width: 100%;
      background: #08160f;
      cursor: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 22, 15, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #overlay h2 { font-size: 28px; color: #ff3b5c; margin-bottom: 8px; }
    #overlay p { font-size: 15px; color: #a7f3d0; margin-bottom: 18px; }
    .btn {
      background: #10b981;
      color: #064e3b;
      font-weight: 700;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #34d399; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="header">
      <div class="metric">
        <span class="label">Score</span>
        <span id="score-val" class="val">0</span>
      </div>
      <div class="metric" style="align-items: center;">
        <span class="label">Lives</span>
        <span id="lives-val" class="val">❤️❤️❤️</span>
      </div>
      <div class="metric" style="align-items: flex-end;">
        <span class="label">Round</span>
        <span id="round-val" class="val">1</span>
      </div>
    </div>
    <canvas id="canvas" width="480" height="472"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Game Over</h2>
      <p id="overlay-msg">Score: 0</p>
      <button class="btn" id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-val');
    const livesEl = document.getElementById('lives-val');
    const roundEl = document.getElementById('round-val');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const restartBtn = document.getElementById('restart-btn');

    let score = 0;
    let lives = 3;
    let round = 1;
    let gameOver = false;

    const paddle = {
      width: 80,
      height: 12,
      x: 200,
      y: 445,
      speed: 7
    };

    let ball = {
      x: 240,
      y: 430,
      dx: 4,
      dy: -4,
      r: 6
    };

    const brickRows = 5;
    const brickCols = 8;
    const brickWidth = 52;
    const brickHeight = 16;
    const brickPadding = 6;
    const brickOffsetTop = 24;
    const brickOffsetLeft = (480 - (brickCols * (brickWidth + brickPadding) - brickPadding)) / 2;

    const BRICK_COLORS = ['#ff2d55', '#fb923c', '#facc15', '#10b981', '#06b6d4'];

    let bricks = [];

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickCols; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRows; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: BRICK_COLORS[r] };
        }
      }
    }

    function init() {
      score = 0;
      lives = 3;
      round = 1;
      gameOver = false;
      overlay.style.display = 'none';
      scoreEl.textContent = '0';
      livesEl.textContent = '❤️❤️❤️';
      roundEl.textContent = '1';
      resetBall();
      initBricks();
      requestAnimationFrame(gameLoop);
    }

    function resetBall() {
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - 12;
      ball.dx = (Math.random() > 0.5 ? 1 : -1) * (3.5 + round * 0.5);
      ball.dy = -(3.5 + round * 0.5);
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, clientX - paddle.width / 2));
    });

    canvas.addEventListener('touchmove', e => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches[0].clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, clientX - paddle.width / 2));
    });

    restartBtn.addEventListener('click', init);

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < brickCols; c++) {
        for (let r = 0; r < brickRows; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (
              ball.x > b.x &&
              ball.x < b.x + brickWidth &&
              ball.y > b.y &&
              ball.y < b.y + brickHeight
            ) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += 10 * (brickRows - r);
              scoreEl.textContent = score;
            }
          }
        }
      }

      if (activeBricks === 0) {
        round++;
        roundEl.textContent = round;
        initBricks();
        resetBall();
      }
    }

    function gameLoop() {
      if (gameOver) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw bricks
      for (let c = 0; c < brickCols; c++) {
        for (let r = 0; r < brickRows; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
          }
        }
      }

      // Draw ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#10b981';
      ctx.fill();
      ctx.closePath();

      // Draw paddle
      ctx.fillStyle = '#ff2d55';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(paddle.x + 4, paddle.y + 2, paddle.width - 8, 2);

      collisionDetection();

      // Ball wall bounce
      if (ball.x + ball.dx > canvas.width - ball.r || ball.x + ball.dx < ball.r) {
        ball.dx = -ball.dx;
      }
      if (ball.y + ball.dy < ball.r) {
        ball.dy = -ball.dy;
      } else if (ball.y + ball.dy > paddle.y - ball.r) {
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
          // Angle bounce based on hit position
          const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          ball.dx = hitPoint * 5;
          ball.dy = -Math.abs(ball.dy);
        } else if (ball.y + ball.dy > canvas.height - ball.r) {
          lives--;
          livesEl.textContent = '❤️'.repeat(lives);
          if (lives <= 0) {
            gameOver = true;
            overlayTitle.textContent = 'Game Over';
            overlayMsg.textContent = `Score: ${score}`;
            overlay.style.display = 'flex';
            return;
          } else {
            resetBall();
          }
        }
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      requestAnimationFrame(gameLoop);
    }

    init();
  </script>
</body>
</html>
