<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soccer Random - Unblocked</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      overflow: hidden;
      background: #0d1117;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    id="game-frame"
    src="./soccer-random/index.html" 
    allow="autoplay; fullscreen; focus-without-user-activation *; gamepad; keyboard-map *; accelerometer; gyroscope" 
    allowfullscreen
  ></iframe>
</body>
</html>
