<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Speed Stars - Unblocked</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f172a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    display: flex; flex-direction: column;
    touch-action: none;
  }
  #topbar {
    height: 44px; flex-shrink: 0;
    background: #090d16; border-bottom: 1px solid #1e293b;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 8px;
  }
  .ev-tabs { display: flex; gap: 4px; overflow-x: auto; }
  .ev-btn {
    background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
    padding: 4px 9px; border-radius: 7px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap;
  }
  .ev-btn.active { background: #dc2626; border-color: #f87171; color: #fff; }
  .hud-right { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; }
  .timer-pill {
    background: #1e293b; border: 1px solid #475569; padding: 4px 10px; border-radius: 7px;
    font-variant-numeric: tabular-nums; color: #fde047;
  }
  #btn-mirror {
    background: #1e293b; color: #94a3b8; border: 1px solid #334155;
    padding: 4px 9px; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  #btn-mirror:hover { color: #fff; border-color: #38bdf8; }

  #arena { flex: 1; position: relative; overflow: hidden; }
  canvas#track { display: block; width: 100%; height: 100%; }
  #mirror-wrap { position: absolute; inset: 0; display: none; background: #000; z-index: 25; }
  #mirror-wrap.active { display: block; }
  #mirror-frame { width: 100%; height: 100%; border: 0; }

  #touch-controls {
    position: absolute; inset: auto 12px 12px 12px; z-index: 15;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
    pointer-events: none;
  }
  .foot-btn {
    pointer-events: auto;
    width: 118px; height: 74px; border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(15, 23, 42, 0.72); color: #fff;
    font-size: 14px; font-weight: 900; backdrop-filter: blur(5px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none;
  }
  .foot-btn:active, .foot-btn.lit { background: rgba(220, 38, 38, 0.85); border-color: #fca5a5; transform: scale(0.96); }
  .jump-btn { width: 92px; height: 60px; background: rgba(14, 165, 233, 0.65); }

  #finish-modal {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(9, 13, 25, 0.84); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #finish-modal.show { display: flex; }
  .card {
    background: #151c2c; border: 2px solid #ef4444; border-radius: 18px;
    padding: 24px; max-width: 350px; width: 100%; text-align: center;
  }
  .card h2 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
  .card p { font-size: 14px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.5; }
  .play-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: 0;
    background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff;
    font-weight: 900; font-size: 15px; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="topbar">
    <div class="ev-tabs">
      <button class="ev-btn active" data-ev="100m">100m</button>
      <button class="ev-btn" data-ev="200m">200m</button>
      <button class="ev-btn" data-ev="400m">400m</button>
      <button class="ev-btn" data-ev="110h">110m Hurdles</button>
    </div>
    <div class="hud-right">
      <span class="timer-pill" id="timer-el">0.00s</span>
      <span class="timer-pill" id="best-el" style="color:#86efac">PB: --</span>
      <button id="btn-mirror" type="button" title="Try External Unity Mirror">⇄ Mirror</button>
    </div>
  </div>

  <div id="arena">
    <canvas id="track"></canvas>
    <div id="touch-controls">
      <button class="foot-btn" id="btn-left">◀ LEFT<span style="font-size:10px;opacity:0.75">[A / ←]</span></button>
      <button class="foot-btn jump-btn" id="btn-jump">JUMP<span style="font-size:10px;opacity:0.75">[SPACE]</span></button>
      <button class="foot-btn" id="btn-right">RIGHT ▶<span style="font-size:10px;opacity:0.75">[D / →]</span></button>
    </div>
    <div id="mirror-wrap"><iframe id="mirror-frame" allow="autoplay; fullscreen; gamepad"></iframe></div>
    <div id="finish-modal">
      <div class="card">
        <h2 id="fin-title">RACE COMPLETE!</h2>
        <p id="fin-stats"></p>
        <button class="play-btn" id="btn-again">Race Again (Space)</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const SAVE_KEY = 'speed_stars_unblocked_v1';
  let bestTimes = {};
  try { bestTimes = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch {}
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(bestTimes)); } catch {} }

  const EVENTS = {
    '100m': { dist: 100, hurdles: 0, label: '100m Dash', aiSpeeds: [10.4, 9.9, 9.4] },
    '200m': { dist: 200, hurdles: 0, label: '200m Sprint', aiSpeeds: [10.2, 9.7, 9.2] },
    '400m': { dist: 400, hurdles: 0, label: '400m Endurance', aiSpeeds: [9.6, 9.1, 8.6] },
    '110h': { dist: 110, hurdles: 7, label: '110m Hurdles', aiSpeeds: [9.7, 9.2, 8.7] }
  };

  let actx = null;
  function sfx(type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime;
      if (type === 'gun') {
        o.type = 'sawtooth'; o.frequency.setValueAtTime(190, t);
        o.frequency.exponentialRampToValueAtTime(45, t + 0.16);
        g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.connect(g); g.connect(actx.destination); o.start(); o.stop(t + 0.19);
      } else if (type === 'step') {
        o.type = 'triangle'; o.frequency.setValueAtTime(125, t);
        o.frequency.exponentialRampToValueAtTime(60, t + 0.05);
        g.gain.setValueAtTime(0.11, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
        o.connect(g); g.connect(actx.destination); o.start(); o.stop(t + 0.06);
      } else if (type === 'win') {
        o.type = 'triangle'; o.frequency.setValueAtTime(523, t);
        o.frequency.setValueAtTime(659, t + 0.09);
        o.frequency.setValueAtTime(784, t + 0.18);
        g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        o.connect(g); g.connect(actx.destination); o.start(); o.stop(t + 0.46);
      }
    } catch {}
  }

  const canvas = document.getElementById('track');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 500;
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = rect.width; H = rect.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let evKey = '100m';
  let state = 'ready'; // ready | countdown | running | finished
  let countdownTime = 0;
  let raceTime = 0;
  let lastFoot = null; // 'L' | 'R'
  let lastTapTime = 0;
  let player = { x: 0, v: 0, y: 0, vy: 0, stride: 0, lean: 0.22, stamina: 1, stumble: 0, finishTime: null };
  let rivals = [];
  let hurdles = [];
  let ghostPositions = [];
  let savedGhost = null;

  function setupEvent(key) {
    evKey = key;
    const ev = EVENTS[key];
    document.querySelectorAll('.ev-btn').forEach(b => b.classList.toggle('active', b.dataset.ev === key));
    document.getElementById('finish-modal').classList.remove('show');
    document.getElementById('btn-jump').style.display = ev.hurdles > 0 ? 'flex' : 'none';

    const pb = bestTimes[key];
    document.getElementById('best-el').textContent = pb ? `PB: ${pb.toFixed(2)}s` : 'PB: --';
    try { savedGhost = JSON.parse(localStorage.getItem(SAVE_KEY + '_ghost_' + key) || 'null'); } catch { savedGhost = null; }

    state = 'ready';
    countdownTime = 0;
    raceTime = 0;
    lastFoot = null;
    lastTapTime = 0;
    ghostPositions = [];
    player = { x: 0, v: 0, y: 0, vy: 0, stride: 0, lean: 0.25, stamina: 1, stumble: 0, finishTime: null };
    rivals = ev.aiSpeeds.map((spd, i) => ({
      name: ['Nova', 'Blaze', 'Flash'][i],
      color: ['#38bdf8', '#a855f7', '#fbbf24'][i],
      lane: i === 0 ? 1 : i === 1 ? 3 : 4,
      x: 0, v: 0, topSpeed: spd, stride: i * 1.4, y: 0, vy: 0, finishTime: null
    }));
    hurdles = [];
    if (ev.hurdles > 0) {
      for (let i = 1; i <= ev.hurdles; i++) {
        hurdles.push({ x: 14 + (i - 1) * 12, knocked: false });
      }
    }
    document.getElementById('timer-el').textContent = '0.00s';
  }

  function triggerStart() {
    if (state === 'ready') {
      state = 'countdown';
      countdownTime = 1.35;
    }
  }

  function stepFoot(side) {
    if (state === 'ready') { triggerStart(); return; }
    if (state === 'countdown') {
      // slight false-start penalty if tapped very early
      if (countdownTime > 0.25) player.stumble = 0.25;
      return;
    }
    if (state !== 'running') return;

    const now = performance.now();
    const dtTap = (now - lastTapTime) / 1000;
    lastTapTime = now;

    if (lastFoot === side) {
      // Repeating same leg loses rhythm slightly
      player.v = Math.max(0, player.v * 0.86);
      player.stumble = 0.14;
    } else {
      lastFoot = side;
      // Sweet spot cadence (0.06s - 0.25s between left & right steps) gives explosive thrust
      const cadenceBonus = dtTap > 0.045 && dtTap < 0.28 ? 1.0 : 0.72;
      const boost = (1.65 + (11.8 - player.v) * 0.16) * cadenceBonus * (player.stumble > 0 ? 0.5 : 1);
      player.v = Math.min(11.9, player.v + boost);
      player.stride += 1.65;
      sfx('step');
    }
  }

  function jumpPlayer() {
    if (state !== 'running') return;
    if (player.y === 0) {
      player.vy = 6.9;
    }
  }

  function update(dt) {
    const ev = EVENTS[evKey];
    if (state === 'countdown') {
      countdownTime -= dt;
      if (countdownTime <= 0) {
        state = 'running';
        sfx('gun');
      }
      return;
    }
    if (state !== 'running') return;

    raceTime += dt;
    document.getElementById('timer-el').textContent = raceTime.toFixed(2) + 's';

    if (player.stumble > 0) player.stumble -= dt;
    // Friction / air drag
    player.v = Math.max(0, player.v - (2.4 + player.v * 0.16) * dt);
    player.x += player.v * dt;
    player.stride += player.v * dt * 1.1;

    // Vertical physics for hurdles
    if (player.y > 0 || player.vy !== 0) {
      player.y += player.vy * dt;
      player.vy -= 21 * dt;
      if (player.y <= 0) { player.y = 0; player.vy = 0; }
    }

    // Hurdle collision
    for (const h of hurdles) {
      if (!h.knocked && Math.abs(player.x - h.x) < 0.55 && player.y < 0.75) {
        h.knocked = true;
        player.v *= 0.58;
        player.stumble = 0.3;
      }
    }

    // Record PB ghost sample every 0.1s
    if (ghostPositions.length < Math.floor(raceTime * 10) + 1) {
      ghostPositions.push(Number(player.x.toFixed(2)));
    }

    // Rivals AI
    for (const r of rivals) {
      if (r.finishTime !== null) continue;
      const accel = (r.topSpeed - r.v) * 2.4;
      r.v += accel * dt;
      r.x += r.v * dt;
      r.stride += r.v * dt * 1.1;
      if (ev.hurdles > 0) {
        for (const h of hurdles) {
          if (Math.abs(r.x - (h.x - 1.2)) < 0.35 && r.y === 0) r.vy = 6.7;
        }
        if (r.y > 0 || r.vy !== 0) {
          r.y += r.vy * dt; r.vy -= 21 * dt;
          if (r.y <= 0) { r.y = 0; r.vy = 0; }
        }
      }
      if (r.x >= ev.dist) r.finishTime = raceTime;
    }

    if (player.x >= ev.dist && player.finishTime === null) {
      player.finishTime = raceTime;
      state = 'finished';
      sfx('win');
      const place = 1 + rivals.filter(r => r.finishTime !== null && r.finishTime < player.finishTime).length;
      const prevPb = bestTimes[evKey];
      const isNewPb = !prevPb || raceTime < prevPb;
      if (isNewPb) {
        bestTimes[evKey] = raceTime;
        persist();
        try { localStorage.setItem(SAVE_KEY + '_ghost_' + evKey, JSON.stringify(ghostPositions)); } catch {}
        document.getElementById('best-el').textContent = `PB: ${raceTime.toFixed(2)}s`;
      }
      const ord = ['1st 🏆', '2nd 🥈', '3rd 🥉', '4th'][place - 1] || `${place}th`;
      document.getElementById('fin-title').textContent = `${ord} Place!`;
      document.getElementById('fin-stats').innerHTML =
        `${ev.label}<br>Official Time: <b>${raceTime.toFixed(2)}s</b>` +
        (isNewPb ? '<br><span style="color:#4ade80;font-weight:900">NEW PERSONAL BEST!</span>' : `<br>Personal Best: ${bestTimes[evKey].toFixed(2)}s`);
      document.getElementById('finish-modal').classList.add('show');
    }
  }

  function drawRunner(sx, baseY, stride, color, lean, yLift, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const bob = Math.abs(Math.sin(stride)) * 4;
    const x = sx;
    const y = baseY - yLift * 36 - bob;
    const legA = Math.sin(stride) * 0.78;
    const legB = Math.sin(stride + Math.PI) * 0.78;
    const torsoX = x + lean * 18;
    const torsoY = y - 28;

    ctx.lineCap = 'round';
    ctx.lineWidth = 5;
    // Back leg & arm
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x + Math.sin(legB) * 18, y); ctx.stroke();

    // Front legs
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x + Math.sin(legA) * 19, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x + Math.sin(legB) * 19, y); ctx.stroke();

    // Torso
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(torsoX, torsoY); ctx.stroke();

    // Arms
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(torsoX, torsoY + 6); ctx.lineTo(torsoX + Math.sin(legB) * 16, torsoY + 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(torsoX, torsoY + 6); ctx.lineTo(torsoX + Math.sin(legA) * 16, torsoY + 14); ctx.stroke();

    // Head
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(torsoX + 2, torsoY - 8, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  function draw() {
    const ev = EVENTS[evKey];
    const pxPerM = Math.max(22, W / 24);
    const camX = Math.max(0, player.x * pxPerM - W * 0.24);

    // Sky + Stadium backdrop
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.45);
    sky.addColorStop(0, '#0284c7'); sky.addColorStop(1, '#7dd3fc');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.45);

    // Bleachers silhouette
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, H * 0.34, W, H * 0.14);
    ctx.fillStyle = '#334155';
    for (let i = 0; i < 4; i++) ctx.fillRect(0, H * (0.36 + i * 0.03), W, 2);

    // Green infield
    ctx.fillStyle = '#16a34a';
    ctx.fillRect(0, H * 0.48, W, H * 0.08);

    // Brick-red 4-lane track
    const trackTop = H * 0.56;
    const laneH = (H - trackTop) / 4;
    ctx.fillStyle = '#b91c1c';
    ctx.fillRect(0, trackTop, W, H - trackTop);

    // Lane lines
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 2;
    for (let i = 0; i <= 4; i++) {
      ctx.beginPath(); ctx.moveTo(0, trackTop + i * laneH); ctx.lineTo(W, trackTop + i * laneH); ctx.stroke();
    }

    // Distance markers every 10m
    ctx.font = '800 12px system-ui';
    ctx.textAlign = 'center';
    for (let m = 0; m <= ev.dist; m += 10) {
      const sx = W * 0.12 + m * pxPerM - camX;
      if (sx < -40 || sx > W + 40) continue;
      ctx.strokeStyle = m === ev.dist ? '#ffffff' : 'rgba(255,255,255,0.3)';
      ctx.lineWidth = m === ev.dist ? 5 : 2;
      ctx.beginPath(); ctx.moveTo(sx, trackTop); ctx.lineTo(sx, H); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(m === ev.dist ? 'FINISH' : `${m}m`, sx, trackTop - 8);
    }

    // Hurdles
    for (const h of hurdles) {
      const sx = W * 0.12 + h.x * pxPerM - camX;
      if (sx < -30 || sx > W + 30) continue;
      ctx.fillStyle = h.knocked ? '#64748b' : '#f8fafc';
      const hY = trackTop + laneH * 2 - (h.knocked ? 10 : 28);
      ctx.fillRect(sx - 3, hY, 6, h.knocked ? 10 : 28);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(sx - 6, hY, 12, 5);
    }

    // PB Ghost runner in player's lane (lane 2)
    if (savedGhost && state === 'running') {
      const gi = Math.min(savedGhost.length - 1, Math.floor(raceTime * 10));
      const gx = savedGhost[gi] || 0;
      drawRunner(W * 0.12 + gx * pxPerM - camX, trackTop + laneH * 2.65, raceTime * 12, '#ffffff', 0.25, 0, 0.35);
    }

    // Rivals (lanes 0, 1, 3)
    const rivalLanes = [0, 1, 3];
    rivals.forEach((r, idx) => {
      const sy = trackTop + (rivalLanes[idx] + 0.72) * laneH;
      drawRunner(W * 0.12 + r.x * pxPerM - camX, sy, r.stride, r.color, 0.22, r.y);
    });

    // Player (lane 2)
    drawRunner(W * 0.12 + player.x * pxPerM - camX, trackTop + 2.72 * laneH, player.stride, '#fde047', player.lean, player.y);

    // Center prompt on Ready / Countdown
    if (state === 'ready' || state === 'countdown') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
      ctx.fillRect(W / 2 - 170, 32, 340, 62);
      ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2;
      ctx.strokeRect(W / 2 - 170, 32, 340, 62);
      ctx.fillStyle = '#fff'; ctx.font = '900 18px system-ui'; ctx.textAlign = 'center';
      if (state === 'ready') {
        ctx.fillText('PRESS A / D OR TAP LEFT / RIGHT', W / 2, 60);
        ctx.font = '700 12px system-ui'; ctx.fillStyle = '#94a3b8';
        ctx.fillText('Alternate Left & Right quickly to sprint!', W / 2, 80);
      } else {
        ctx.fillStyle = '#fde047'; ctx.font = '900 24px system-ui';
        ctx.fillText(countdownTime > 0.5 ? 'ON YOUR MARKS...' : 'SET...', W / 2, 71);
      }
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // Input listeners
  const btnL = document.getElementById('btn-left');
  const btnR = document.getElementById('btn-right');
  const btnJ = document.getElementById('btn-jump');

  const bindBtn = (el, fn) => {
    const fire = (e) => { e.preventDefault(); el.classList.add('lit'); fn(); };
    const off = () => el.classList.remove('lit');
    el.addEventListener('pointerdown', fire);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
  };
  bindBtn(btnL, () => stepFoot('L'));
  bindBtn(btnR, () => stepFoot('R'));
  bindBtn(btnJ, jumpPlayer);

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') { e.preventDefault(); btnL.classList.add('lit'); stepFoot('L'); }
    if (e.code === 'KeyD' || e.code === 'ArrowRight') { e.preventDefault(); btnR.classList.add('lit'); stepFoot('R'); }
    if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (state === 'finished') setupEvent(evKey);
      else jumpPlayer();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') btnL.classList.remove('lit');
    if (e.code === 'KeyD' || e.code === 'ArrowRight') btnR.classList.remove('lit');
  });

  document.querySelectorAll('.ev-btn').forEach(b => { b.onclick = () => setupEvent(b.dataset.ev); });
  document.getElementById('btn-again').onclick = () => setupEvent(evKey);

  // Mirror Toggle
  const mWrap = document.getElementById('mirror-wrap');
  const mFrame = document.getElementById('mirror-frame');
  let mirrorOn = false;
  document.getElementById('btn-mirror').onclick = (e) => {
    mirrorOn = !mirrorOn;
    if (mirrorOn) {
      const target = 'https://freeonlinewebtools.github.io/gamelist6.github.io/Speed-Stars/';
      const isStatic = window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:';
      mFrame.src = isStatic ? target : `/api/proxy/game?url=${encodeURIComponent(target)}`;
      mWrap.classList.add('active');
      e.target.textContent = 'HTML5 Mode';
    } else {
      mFrame.src = 'about:blank';
      mWrap.classList.remove('active');
      e.target.textContent = '⇄ Mirror';
    }
  };

  window.addEventListener('resize', resize);
  resize();
  setupEvent('100m');
  requestAnimationFrame(loop);
})();
