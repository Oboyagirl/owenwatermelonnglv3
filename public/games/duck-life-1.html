<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duck Life</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #ruffle-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
  </style>
</head>
<body>
  <div id="ruffle-container"></div>
  <script src="../ruffle/ruffle.js"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      letterbox: "on",
      autoplay: "on",
      unmuteOverlay: "hidden",
      backgroundColor: "#000000",
      allowScriptAccess: true,
      warnOnUnsupportedContent: false,
      logLevel: "error",
      showSwfDownload: false,
      splashScreen: false,
      openUrlMode: "confirm",
      quality: "high",
      forceScale: true,
      wmode: "opaque",
      preferredRenderer: "webgl",
      publicPath: "../ruffle/"
    };

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle-container");
        container.appendChild(player);
        player.style.width = "100%";
        player.style.height = "100%";
        player.load("swfs/ducklife1.swf");
      } catch (err) {
        console.error("Local Ruffle load failed, falling back to mirror", err);
        window.location.replace("https://ubghyper.github.io/GameList.github.io/Duck-Life/");
      }
    });
  </script>
</body>
</html>
