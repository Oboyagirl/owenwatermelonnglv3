<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sawyer For Sawyer - A Small World Cup</title>
  <style>
    body, html, iframe {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      border: 0;
      display: block;
    }
    .forceIosScrolling {
      overflow: scroll;
      -webkit-overflow-scrolling: touch;
    }
  </style>
  <script src="https://apis.google.com/_/scs/abc-static/_/js/k=gapi.lb.en.gh7qIZtzO5w.O/m=gapi_rpc/rt=j/sv=1/d=1/ed=1/rs=AHpOoo84YKT1RVy0T6hcXi5rH3LooB1WCw/cb=gapi.loaded_0?le=scs,fedcm_migration_mod" async=""></script>
  <script src="https://apis.google.com/js/api.js?checkCookie=1" gapi_processed="true"></script>
</head>

<body>
<iframe 
  id="innerFrame" 
  name="innerFrame" 
  sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-popups-to-escape-sandbox allow-downloads allow-storage-access-by-user-activation" 
  frameborder="0" 
  allowfullscreen="" 
  allow="autoplay; fullscreen; focus-without-user-activation *; gamepad; keyboard-map *; accelerometer; gyroscope"
  src="https://asmallworldcup.gitlab.io/file/" 
  style="overflow: auto;"
>
</iframe>

<script>
  let policy;
  if (window.trustedTypes && window.trustedTypes.createPolicy) {
    try {
      policy = window.trustedTypes.createPolicy('atari-gapi-loader', {
        createScriptURL: (url) => {
          if (url === 'https://apis.google.com/js/api.js?checkCookie=1') {
            return url;
          }
          throw new Error('Attempted to load unexpected script URL');
        }
      });
    } catch (e) {
      console.warn('TrustedTypes policy error:', e);
    }
  }

  function loadGapi() {
    var loaderScript = document.createElement('script');
    var url = 'https://apis.google.com/js/api.js?checkCookie=1';
    if (policy) {
      loaderScript.src = policy.createScriptURL(url);
    } else {
      loaderScript.setAttribute('src', url);
    }
    loaderScript.onload = function() {
      this.onload = function() {};
      loadGapiClient();
    };
    loaderScript.onreadystatechange = function() {
      if (this.readyState === 'complete') {
        this.onload();
      }
    };
    loaderScript.onerror = function() {
      console.warn('gapi load failed (running in offline/strict network mode)');
    };
    (document.head || document.body || document.documentElement).appendChild(loaderScript);
  }

  function updateInnerFrame(url, enableInteraction, forceIosScrolling) {
    var urlEl = document.createElement('a');
    urlEl.setAttribute('href', url);
    if (urlEl.protocol != "https:" && urlEl.protocol != "http:") {
      return;
    }
    var iframe = document.getElementById('innerFrame');
    if (!iframe) return;
    iframe.src = url;
    iframe.onload = function() {
      if (window.gapi && gapi.rpc) {
        gapi.rpc.call('..', 'innerFrameLoaded');
      }
    };

    if (enableInteraction) {
      if (forceIosScrolling) {
        var iframeParent = iframe.parentElement;
        if (iframeParent) iframeParent.classList.add('forceIosScrolling');
      } else {
        iframe.style.overflow = 'auto';
      }
    } else {
      iframe.style.pointerEvents = 'none';
    }
  }

  function updateInnerIframeCode(userCode, enableInteraction, forceIosScrolling, enableHtmlSitesGenAi, isLiquidArtifact = false, inEditor = false) {
    if (enableHtmlSitesGenAi && isLiquidArtifact && enableInteraction) {
      var innerFrame = document.getElementById('innerFrame');
      if (innerFrame) {
        innerFrame.style.pointerEvents = 'auto';
        innerFrame.setAttribute('scrolling', 'auto');
      }
    }
    if (window.gapi && gapi.rpc) {
      gapi.rpc.setup('innerFrame');
      gapi.rpc.call(
        'innerFrame',
        'updateUserHtmlFrame',
        undefined /* opt_callback */,
        userCode,
        enableInteraction,
        forceIosScrolling,
        enableHtmlSitesGenAi,
        isLiquidArtifact,
        inEditor);
    }
  }

  const MessageAction = {
    GENAI_TEXT_EDIT: 'ATARI_GENAI_TEXT_EDIT',
    JS_CRASH: 'onJsCrash'
  };

  function onPostMessage(ev) {
    var innerFrame = document.getElementById('innerFrame');
    var type = ev.data && ev.data['type'];
    if (ev.data && ev.data['magic'] != 'SHIC' && (type != MessageAction.GENAI_TEXT_EDIT && type != MessageAction.JS_CRASH || !innerFrame || ev.source !== innerFrame.contentWindow)) {
      return;
    }
    switch (type) {
      case 'resize':
        var height = ev.data['height'];
        if (window.gapi && gapi.rpc) gapi.rpc.call('..', 'resize', undefined /* opt_callback */, height);
        break;
      case MessageAction.GENAI_TEXT_EDIT:
        window.parent.postMessage(ev.data, '*');
        break;
      case MessageAction.JS_CRASH:
        if (window.gapi && gapi.rpc) {
          gapi.rpc.call('..', 'onJsCrash', undefined /* opt_callback */, {
            message: ev.data['message'],
            stack: ev.data['stack']
          });
        }
        break;
    }
  }

  function onGapiInitialized() {
    if (window.gapi && gapi.rpc) {
      gapi.rpc.call('..', 'gapiInitialized');
      gapi.rpc.register('updateInnerFrame', updateInnerFrame);
      gapi.rpc.register('updateInnerIframeCode', updateInnerIframeCode);
      window.addEventListener('message', onPostMessage);
    }
  }

  function loadGapiClient() {
    if (window.gapi && gapi.load) {
      gapi.load('gapi.rpc', onGapiInitialized);
    }
  }

  // Automatic backup mirror in case gitlab is unreachable
  const frame = document.getElementById('innerFrame');
  if (frame) {
    frame.addEventListener('error', function() {
      console.warn('Switching to verified backup mirror for A Small World Cup');
      frame.src = 'https://7zeb.github.io/homework/steal-a-brainrot/go/a-small-world-cup.html';
    });
  }

  if (document.readyState == 'complete') {
    try { loadGapi(); } catch(e){}
  } else {
    self.addEventListener('load', function() {
      try { loadGapi(); } catch(e){}
    });
  }
</script>

</body>
</html>
