<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flash Arcade Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #fff;
      z-index: 50;
      gap: 16px;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f1f5f9;
    }
    #loading-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    #error-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #fff;
      z-index: 60;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    .error-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      padding: 28px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .error-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #f87171;
      background: rgba(239, 68, 68, 0.15);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .error-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .error-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .btn-retry {
      background: #0284c7;
      color: #fff;
      border: 0;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-retry:hover {
      background: #0ea5e9;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
    /* Suppress Ruffle orange warning modal / error overlay */
    ruffle-player::part(message-overlay),
    #message-overlay,
    .message-overlay {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>

  <!-- Pre-configure Ruffle BEFORE loading script -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      letterbox: "on",
      autoplay: "on",
      unmuteOverlay: "hidden",
      backgroundColor: "#000000",
      allowScriptAccess: true,
      warnOnUnsupportedContent: false,
      logLevel: "error",
      showSwfDownload: false,
      splashScreen: false,
      openUrlMode: "confirm"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle" onerror="loadFallbackRuffle()"></script>
  <script>
    function loadFallbackRuffle() {
      console.warn("Primary Ruffle CDN failed, loading fallback from unpkg...");
      const s = document.createElement("script");
      s.src = "https://unpkg.com/@ruffle-rs/ruffle/ruffle.js";
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="player-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Starting Flash Emulator...</div>
      <div id="loading-sub">Loading WebAssembly & Game Asset Stream</div>
    </div>
    <div id="error-overlay">
      <div class="error-card">
        <div class="error-badge">Flash Player Recovery</div>
        <div class="error-title">Unable to Stream Game</div>
        <div class="error-desc" id="error-message">The Flash game file took too long to respond. Click retry to reload via the secure proxy mirror.</div>
        <button class="btn-retry" onclick="retryLoading()">Retry Game</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawSwf = params.get('swf');
    const title = params.get('title') || 'Flash Game';
    document.title = title;

    function getStreamUrl(inputUrl) {
      if (!inputUrl) return '';
      // If already proxied, keep
      if (inputUrl.startsWith('/api/swf') || inputUrl.startsWith('/api/proxy')) {
        return inputUrl;
      }
      // If relative URL, keep
      if (!inputUrl.startsWith('http://') && !inputUrl.startsWith('https://')) {
        return inputUrl;
      }
      // If jsdelivr or raw github, test direct first or route through proxy
      return inputUrl;
    }

    let currentSwfUrl = getStreamUrl(rawSwf);
    let playerInstance = null;

    function showError(msg) {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.style.display = 'none';
      const errOverlay = document.getElementById('error-overlay');
      if (errOverlay) {
        if (msg) document.getElementById('error-message').textContent = msg;
        errOverlay.style.display = 'flex';
      }
    }

    function retryLoading() {
      window.location.reload();
    }

    if (!rawSwf) {
      showError("No game specified in URL query.");
    } else {
      function startPlayer() {
        if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
          setTimeout(startPlayer, 100);
          return;
        }

        try {
          const ruffle = window.RufflePlayer.newest();
          playerInstance = ruffle.createPlayer();
          const container = document.getElementById("player-container");
          const overlay = document.getElementById("loading-overlay");

          container.appendChild(playerInstance);

          playerInstance.addEventListener("loadedmetadata", () => {
            if (overlay) overlay.style.display = 'none';
          });

          // Compute base URL for relative Flash resources
          let swfBase = "";
          if (rawSwf && (rawSwf.startsWith('http://') || rawSwf.startsWith('https://'))) {
            swfBase = rawSwf.substring(0, rawSwf.lastIndexOf('/') + 1);
          }

          // Fallback timeout: if game takes over 15 seconds
          const timeoutId = setTimeout(() => {
            if (overlay && overlay.style.display !== 'none') {
              console.warn("Ruffle taking long to load, checking status");
            }
          }, 15000);

          function attemptLoad(urlToLoad) {
            playerInstance.load({
              url: urlToLoad,
              base: swfBase,
              parameters: "",
              autoplay: "auto",
              backgroundColor: "#000000"
            }).then(() => {
              clearTimeout(timeoutId);
              setTimeout(() => {
                if (overlay) overlay.style.display = 'none';
              }, 300);
            }).catch(err => {
              clearTimeout(timeoutId);
              console.warn("Direct stream load error, trying server proxy fallback:", err);
              if (!urlToLoad.startsWith('/api/swf')) {
                const proxyUrl = '/api/swf?url=' + encodeURIComponent(rawSwf);
                attemptLoad(proxyUrl);
              } else {
                showError("Flash asset error: " + (err.message || "Failed to load game stream"));
              }
            });
          }

          attemptLoad(currentSwfUrl);

          // Periodically ensure Ruffle internal error modal is hidden if created in shadowRoot
          setInterval(() => {
            if (playerInstance && playerInstance.shadowRoot) {
              const modal = playerInstance.shadowRoot.querySelector('#message-overlay') || 
                            playerInstance.shadowRoot.querySelector('.message-overlay');
              if (modal && modal.style.display !== 'none') {
                modal.style.display = 'none';
              }
            }
          }, 500);

        } catch (e) {
          console.error("Ruffle initialization error:", e);
          showError("Could not initialize Flash emulator: " + e.message);
        }
      }

      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", startPlayer);
      } else {
        startPlayer();
      }
    }
  </script>
</body>
</html>
