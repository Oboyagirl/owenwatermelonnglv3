<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flash Arcade Runner</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020810;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 10;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #e2e8f0;
    }
    #loading-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle" onerror="loadFallbackRuffle()"></script>
  <script>
    function loadFallbackRuffle() {
      console.warn("Primary Ruffle CDN failed, loading fallback from unpkg...");
      const s = document.createElement("script");
      s.src = "https://unpkg.com/@ruffle-rs/ruffle";
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="player-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Starting Flash Emulator...</div>
      <div id="loading-sub">Loading Ruffle WebAssembly Engine</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const swf = params.get('swf');
    const title = params.get('title') || 'Flash Game';
    document.title = title;

    if (!swf) {
      document.getElementById('loading-text').textContent = "No game specified.";
      document.querySelector('.spinner').style.display = 'none';
    } else {
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        letterbox: "on",
        autoplay: "on",
        unmuteOverlay: "hidden",
        backgroundColor: "#000000"
      };

      window.addEventListener("DOMContentLoaded", () => {
        try {
          const ruffle = window.RufflePlayer.newest();
          const player = ruffle.createPlayer();
          const container = document.getElementById("player-container");
          const overlay = document.getElementById("loading-overlay");

          container.appendChild(player);

          player.addEventListener("loadedmetadata", () => {
            if (overlay) overlay.remove();
          });

          player.load({
            url: swf,
            parameters: "",
            autoplay: "auto",
            backgroundColor: "#000000"
          }).then(() => {
            setTimeout(() => {
              if (overlay) overlay.remove();
            }, 500);
          }).catch(err => {
            console.error("Ruffle load error:", err);
            // Even if event fails, remove overlay after short grace period
            setTimeout(() => {
              if (overlay) overlay.remove();
            }, 1500);
          });
        } catch (e) {
          console.error("Ruffle init error:", e);
          const overlay = document.getElementById("loading-overlay");
          if (overlay) overlay.remove();
        }
      });
    }
  </script>
</body>
</html>
