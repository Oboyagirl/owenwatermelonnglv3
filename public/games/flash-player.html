<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcade Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #fff;
      z-index: 50;
      gap: 14px;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
    /* Completely suppress Ruffle warnings, modals, and panic popups */
    ruffle-player::part(message-overlay),
    #message-overlay,
    .message-overlay,
    #panic,
    .panic,
    [id*="panic"],
    [class*="panic"],
    [id*="modal"],
    [class*="modal"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      letterbox: "on",
      autoplay: "on",
      unmuteOverlay: "hidden",
      backgroundColor: "#000000",
      allowScriptAccess: true,
      warnOnUnsupportedContent: false,
      logLevel: "error",
      showSwfDownload: false,
      splashScreen: false,
      openUrlMode: "confirm",
      quality: "high",
      maxExecutionDuration: 60,
      playerVersion: 32,
      forceScale: true,
      wmode: "opaque",
      preferredRenderer: "webgl",
      publicPath: "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js" onerror="loadFallbackRuffle()"></script>
  <script>
    function loadFallbackRuffle() {
      const s = document.createElement("script");
      s.src = "https://ubghyper.github.io/GameList.github.io/ruffle/ruffle.js";
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="player-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Loading Game...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawSwf = params.get('swf');
    const title = params.get('title') || 'Arcade Game';
    document.title = title;
    const loadingText = document.getElementById('loading-text');
    if (loadingText && title && title !== 'Arcade Game') {
      loadingText.textContent = 'Loading ' + title + '...';
    }

    let playerInstance = null;
    let suppressInterval = null;

    function hideOverlay() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 300);
      }
    }

    if (rawSwf) {
      function startPlayer() {
        if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
          setTimeout(startPlayer, 100);
          return;
        }

        try {
          const ruffle = window.RufflePlayer.newest();
          playerInstance = ruffle.createPlayer();
          const container = document.getElementById("player-container");

          container.appendChild(playerInstance);

          playerInstance.addEventListener("loadedmetadata", hideOverlay);

          let swfBase = "";
          if (rawSwf.startsWith('http://') || rawSwf.startsWith('https://')) {
            swfBase = rawSwf.substring(0, rawSwf.lastIndexOf('/') + 1);
          }

          // Safety timeout
          setTimeout(hideOverlay, 8000);

          let primaryUrl = rawSwf;
          if (rawSwf.startsWith('http://') || rawSwf.startsWith('https://')) {
            if (window.location.protocol.startsWith('http') && !rawSwf.startsWith(window.location.origin)) {
              primaryUrl = '/api/swf?url=' + encodeURIComponent(rawSwf);
            }
          }

          playerInstance.load({
            url: primaryUrl,
            base: swfBase,
            parameters: "",
            autoplay: "auto",
            backgroundColor: "#000000"
          }).then(() => {
            setTimeout(hideOverlay, 200);
          }).catch(() => {
            // Fall back to direct SWF URL if proxy had an issue
            playerInstance.load({
              url: rawSwf,
              base: swfBase,
              parameters: "",
              autoplay: "auto",
              backgroundColor: "#000000"
            }).finally(hideOverlay);
          });

          // Continuously silence any Ruffle shadowRoot dialogs
          suppressInterval = setInterval(() => {
            if (playerInstance && playerInstance.shadowRoot) {
              const modal = playerInstance.shadowRoot.querySelector('#message-overlay') || 
                            playerInstance.shadowRoot.querySelector('.message-overlay') ||
                            playerInstance.shadowRoot.querySelector('#panic') ||
                            playerInstance.shadowRoot.querySelector('.panic');
              if (modal) modal.remove();
            }
          }, 400);

          window.addEventListener('beforeunload', () => {
            if (suppressInterval) clearInterval(suppressInterval);
          });

        } catch (e) {
          hideOverlay();
        }
      }

      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", startPlayer);
      } else {
        startPlayer();
      }
    } else {
      hideOverlay();
    }
  </script>
</body>
</html>
