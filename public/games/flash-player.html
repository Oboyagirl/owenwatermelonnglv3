<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flash Arcade Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #fff;
      z-index: 50;
      gap: 16px;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f1f5f9;
    }
    #loading-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    #error-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #fff;
      z-index: 60;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    .error-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .error-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .error-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .error-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-action {
      background: #0284c7;
      color: #fff;
      border: 0;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #0ea5e9;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
    /* Suppress Ruffle orange warning modal / error overlay */
    ruffle-player::part(message-overlay),
    #message-overlay,
    .message-overlay,
    #panic,
    .panic,
    [id*="panic"],
    [class*="panic"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>

  <!-- Pre-configure Ruffle BEFORE loading script with memory-optimized limits for large AS3 games -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      letterbox: "on",
      autoplay: "on",
      unmuteOverlay: "hidden",
      backgroundColor: "#000000",
      allowScriptAccess: true,
      warnOnUnsupportedContent: false,
      logLevel: "error",
      showSwfDownload: false,
      splashScreen: false,
      openUrlMode: "confirm",
      quality: "medium",
      maxExecutionDuration: 60,
      playerVersion: 32,
      forceScale: true,
      wmode: "opaque",
      preferredRenderer: "webgl"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle" onerror="loadFallbackRuffle()"></script>
  <script>
    function loadFallbackRuffle() {
      console.warn("Primary Ruffle CDN failed, loading fallback from unpkg...");
      const s = document.createElement("script");
      s.src = "https://unpkg.com/@ruffle-rs/ruffle/ruffle.js";
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="player-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Starting Flash Emulator...</div>
      <div id="loading-sub">Initializing Flash Engine & WebAssembly Stream</div>
    </div>
    <div id="error-overlay">
      <div class="error-card">
        <div class="error-badge">Flash Stream Recovery</div>
        <div class="error-title">Optimizing Game Stream</div>
        <div class="error-desc" id="error-message">This Flash game requires the dedicated same-origin streaming proxy. Click below to launch with enhanced memory allocation.</div>
        <div class="btn-group">
          <button class="btn-action" onclick="loadViaProxy()">Stream via Proxy</button>
          <button class="btn-secondary" onclick="retryLoading()">Reload</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawSwf = params.get('swf');
    const title = params.get('title') || 'Flash Game';
    document.title = title;

    let currentSwfUrl = rawSwf || '';
    let playerInstance = null;
    let suppressInterval = null;

    function showError(msg) {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.style.display = 'none';
      const errOverlay = document.getElementById('error-overlay');
      if (errOverlay) {
        if (msg) document.getElementById('error-message').textContent = msg;
        errOverlay.style.display = 'flex';
      }
    }

    function retryLoading() {
      window.location.reload();
    }

    function loadViaProxy() {
      if (!rawSwf) return;
      const proxyUrl = '/api/swf?url=' + encodeURIComponent(rawSwf);
      const newUrl = window.location.pathname + '?swf=' + encodeURIComponent(proxyUrl) + '&title=' + encodeURIComponent(title);
      window.location.href = newUrl;
    }

    if (!rawSwf) {
      showError("No game specified in URL query.");
    } else {
      function startPlayer() {
        if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
          setTimeout(startPlayer, 100);
          return;
        }

        try {
          const ruffle = window.RufflePlayer.newest();
          playerInstance = ruffle.createPlayer();
          const container = document.getElementById("player-container");
          const overlay = document.getElementById("loading-overlay");

          container.appendChild(playerInstance);

          playerInstance.addEventListener("loadedmetadata", () => {
            if (overlay) {
              overlay.style.opacity = '0';
              setTimeout(() => { overlay.style.display = 'none'; }, 300);
            }
          });

          // Compute base URL for relative Flash resources
          let swfBase = "";
          if (rawSwf && (rawSwf.startsWith('http://') || rawSwf.startsWith('https://'))) {
            swfBase = rawSwf.substring(0, rawSwf.lastIndexOf('/') + 1);
          }

          // Fallback timeout: if game takes over 20 seconds, hide overlay and ensure canvas is responsive
          const timeoutId = setTimeout(() => {
            if (overlay && overlay.style.display !== 'none') {
              overlay.style.opacity = '0';
              setTimeout(() => { overlay.style.display = 'none'; }, 300);
            }
          }, 20000);

          function attemptLoad(urlToLoad) {
            playerInstance.load({
              url: urlToLoad,
              base: swfBase,
              parameters: "",
              autoplay: "auto",
              backgroundColor: "#000000"
            }).then(() => {
              clearTimeout(timeoutId);
              setTimeout(() => {
                if (overlay) {
                  overlay.style.opacity = '0';
                  setTimeout(() => { overlay.style.display = 'none'; }, 300);
                }
              }, 400);
            }).catch(err => {
              clearTimeout(timeoutId);
              console.warn("Direct stream load error, trying server proxy fallback:", err);
              if (!urlToLoad.startsWith('/api/swf')) {
                const proxyUrl = '/api/swf?url=' + encodeURIComponent(rawSwf);
                attemptLoad(proxyUrl);
              } else {
                showError("Flash asset error: " + (err.message || "Failed to load game stream"));
              }
            });
          }

          attemptLoad(currentSwfUrl);

          // Permanently suppress Ruffle internal panic/error modals in shadowRoot
          function suppressShadowModals() {
            if (playerInstance && playerInstance.shadowRoot) {
              if (!playerInstance.shadowRoot.querySelector('#anti-panic-style')) {
                const s = document.createElement('style');
                s.id = 'anti-panic-style';
                s.textContent = `
                  #message-overlay, .message-overlay, #panic, .panic, [id*="panic"], [class*="panic"], [id*="modal"], [class*="modal"] {
                    display: none !important;
                    visibility: hidden !important;
                    opacity: 0 !important;
                    pointer-events: none !important;
                  }
                `;
                playerInstance.shadowRoot.appendChild(s);
              }
              const modal = playerInstance.shadowRoot.querySelector('#message-overlay') || 
                            playerInstance.shadowRoot.querySelector('.message-overlay') ||
                            playerInstance.shadowRoot.querySelector('#panic') ||
                            playerInstance.shadowRoot.querySelector('.panic');
              if (modal) {
                modal.remove();
                if (overlay) {
                  overlay.style.display = 'none';
                }
              }
            }
          }
          suppressInterval = setInterval(suppressShadowModals, 300);

          window.addEventListener('beforeunload', () => {
            if (suppressInterval) clearInterval(suppressInterval);
          });

        } catch (e) {
          console.error("Ruffle initialization error:", e);
          showError("Could not initialize Flash emulator: " + e.message);
        }
      }

      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", startPlayer);
      } else {
        startPlayer();
      }
    }
  </script>
</body>
</html>
