<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Defender - Owen Watermelon V3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #08160f;
      color: #f1f5f9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 440px;
      height: 540px;
      max-width: 95vw;
      background: #06110b;
      border: 3px solid #16402a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    #header {
      height: 48px;
      background: rgba(8, 22, 15, 0.95);
      border-bottom: 2px solid #16402a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
    }
    .metric { display: flex; flex-direction: column; }
    .label { font-size: 10px; text-transform: uppercase; color: #6ee7b7; }
    .val { font-size: 16px; font-weight: 700; color: #fff; font-family: monospace; }
    canvas {
      flex: 1;
      width: 100%;
      background: #06110b;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 17, 11, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #overlay h2 { font-size: 30px; color: #ff3b5c; margin-bottom: 6px; }
    #overlay p { font-size: 15px; color: #a7f3d0; margin-bottom: 18px; }
    .btn {
      background: #10b981;
      color: #064e3b;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn:hover { background: #34d399; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="header">
      <div class="metric">
        <span class="label">Score</span>
        <span id="score-val" class="val">0</span>
      </div>
      <div class="metric" style="align-items: center;">
        <span class="label">Shield</span>
        <span id="shield-val" class="val">100%</span>
      </div>
      <div class="metric" style="align-items: flex-end;">
        <span class="label">Wave</span>
        <span id="wave-val" class="val">1</span>
      </div>
    </div>
    <canvas id="canvas" width="440" height="492"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Space Station Down</h2>
      <p id="overlay-msg">Score: 0</p>
      <button class="btn" id="restart-btn">Launch Mission</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const shieldVal = document.getElementById('shield-val');
    const waveVal = document.getElementById('wave-val');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const restartBtn = document.getElementById('restart-btn');

    let player = { x: 220, y: 440, w: 32, h: 28, speed: 6, shield: 100 };
    let bullets = [];
    let enemies = [];
    let stars = [];
    let particles = [];
    let keys = {};
    let score = 0;
    let wave = 1;
    let isGameOver = false;
    let lastShot = 0;

    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        s: Math.random() * 2 + 0.5,
        v: Math.random() * 1.5 + 0.5
      });
    }

    function init() {
      player.x = 220;
      player.shield = 100;
      bullets = [];
      enemies = [];
      particles = [];
      score = 0;
      wave = 1;
      isGameOver = false;
      scoreVal.textContent = '0';
      shieldVal.textContent = '100%';
      waveVal.textContent = '1';
      overlay.style.display = 'none';
      spawnWave();
      requestAnimationFrame(loop);
    }

    function spawnWave() {
      enemies = [];
      const rows = 3 + Math.min(2, Math.floor(wave / 2));
      const cols = 6;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 40 + c * 60,
            y: 30 + r * 45,
            w: 28,
            h: 22,
            hp: r === 0 ? 2 : 1,
            type: r === 0 ? '👾' : (r === 1 ? '🛸' : '🍉'),
            dx: 1.2 + wave * 0.2
          });
        }
      }
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      player.x = Math.max(16, Math.min(canvas.width - 16, e.clientX - rect.left));
    });

    restartBtn.addEventListener('click', init);

    function loop(time) {
      if (isGameOver) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      stars.forEach(s => {
        s.y += s.v;
        if (s.y > canvas.height) s.y = 0;
        ctx.fillRect(s.x, s.y, s.s, s.s);
      });

      // Player Movement
      if (keys['ArrowLeft'] || keys['a']) player.x = Math.max(16, player.x - player.speed);
      if (keys['ArrowRight'] || keys['d']) player.x = Math.min(canvas.width - 16, player.x + player.speed);

      // Firing
      if ((keys['Space'] || keys['ArrowUp'] || keys['w']) && time - lastShot > 180) {
        bullets.push({ x: player.x, y: player.y - 12, v: 9 });
        lastShot = time;
      }

      // Draw Player
      ctx.save();
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - 14);
      ctx.lineTo(player.x - 16, player.y + 14);
      ctx.lineTo(player.x + 16, player.y + 14);
      ctx.closePath();
      ctx.fill();
      // cockpit
      ctx.fillStyle = '#ff2d55';
      ctx.beginPath();
      ctx.arc(player.x, player.y + 2, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.v;
        ctx.fillStyle = '#2dd4bf';
        ctx.fillRect(b.x - 2, b.y - 6, 4, 12);

        // Check hit enemy
        for (let j = enemies.length - 1; j >= 0; j--) {
          const en = enemies[j];
          if (b.x > en.x - en.w/2 && b.x < en.x + en.w/2 && b.y > en.y - en.h/2 && b.y < en.y + en.h/2) {
            en.hp--;
            bullets.splice(i, 1);
            if (en.hp <= 0) {
              enemies.splice(j, 1);
              score += 20;
              scoreVal.textContent = score;
            }
            break;
          }
        }

        if (b.y < -10) bullets.splice(i, 1);
      }

      // Update Enemies
      let edgeHit = false;
      enemies.forEach(en => {
        en.x += en.dx;
        if (en.x > canvas.width - 24 || en.x < 24) edgeHit = true;
      });

      if (edgeHit) {
        enemies.forEach(en => {
          en.dx = -en.dx;
          en.y += 14;
          if (en.y > player.y - 16) {
            player.shield -= 25;
            shieldVal.textContent = `${Math.max(0, player.shield)}%`;
            if (player.shield <= 0) {
              isGameOver = true;
              overlayMsg.textContent = `Score: ${score}`;
              overlay.style.display = 'flex';
            }
          }
        });
      }

      // Draw Enemies
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      enemies.forEach(en => {
        ctx.fillText(en.type, en.x, en.y);
      });

      // Check Next Wave
      if (enemies.length === 0) {
        wave++;
        waveVal.textContent = wave;
        score += 150;
        scoreVal.textContent = score;
        spawnWave();
      }

      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
