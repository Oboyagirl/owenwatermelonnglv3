<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Papa's Scooperia</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080c14;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 10;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fef08a;
    }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="player-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Loading Papa's Scooperia...</div>
      <div style="font-size: 12px; color: #94a3b8;">Preparing ice cream sundaes and cookies</div>
    </div>
  </div>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      letterbox: "on",
      autoplay: "on",
      unmuteOverlay: "hidden",
      backgroundColor: "#000000"
    };

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player-container");
        const overlay = document.getElementById("loading-overlay");

        container.appendChild(player);

        player.addEventListener("loadedmetadata", () => {
          if (overlay) overlay.remove();
        });

        player.load({
          url: "https://raw.githubusercontent.com/sz-games/Games9/main/papasscooperia.swf",
          parameters: "",
          autoplay: "auto",
          backgroundColor: "#000000"
        }).then(() => {
          setTimeout(() => {
            if (overlay) overlay.remove();
          }, 400);
        }).catch(err => {
          console.error("Ruffle load error:", err);
          setTimeout(() => {
            if (overlay) overlay.remove();
          }, 1200);
        });
      } catch (e) {
        console.error("Ruffle init error:", e);
        const overlay = document.getElementById("loading-overlay");
        if (overlay) overlay.remove();
      }
    });
  </script>
</body>
</html>
