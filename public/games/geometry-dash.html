<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geometry Dash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
    #loading-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050b14;
      color: #fff;
      z-index: 20;
      gap: 14px;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .gd-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #eab308;
      border-right-color: #22c55e;
      border-radius: 50%;
      animation: gd-spin 0.8s linear infinite;
    }
    @keyframes gd-spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 16px;
      font-weight: 700;
      color: #fef08a;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #loading-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    #controls-bar {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 30;
      display: flex;
      gap: 6px;
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    #controls-bar:hover {
      opacity: 1;
    }
    .gd-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .gd-btn:hover {
      background: rgba(234, 179, 8, 0.8);
      border-color: #eab308;
      color: #000;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="gd-spinner"></div>
    <div id="loading-text">Loading Geometry Dash...</div>
    <div id="loading-sub">Connecting to high-speed canvas engine</div>
  </div>

  <iframe
    id="game-frame"
    src="https://geometry-dash.pages.dev/"
    allow="autoplay; fullscreen; focus-without-user-activation *; gamepad; keyboard-map *; accelerometer; gyroscope"
    allowfullscreen
  ></iframe>

  <div id="controls-bar">
    <button class="gd-btn" onclick="switchEngine()">⇄ Engine (<span id="engine-label">Classic</span>)</button>
    <button class="gd-btn" onclick="reloadGD()">↺ Reload</button>
    <button class="gd-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

  <script>
    const frame = document.getElementById('game-frame');
    const loader = document.getElementById('loading-container');
    const label = document.getElementById('engine-label');

    const engines = [
      { name: "Classic", url: "https://geometry-dash.pages.dev/" },
      { name: "Remastered", url: "https://7zeb.github.io/homework/geometry-dash-remastered/index.html" },
      { name: "Meltdown", url: "https://7zeb.github.io/homework/geometryvibes.html" },
      { name: "Lite", url: "https://ubghyper.github.io/GameList.github.io/Geometry-Dash-Lite/" }
    ];
    let currentEngine = 0;

    frame.onload = function() {
      setTimeout(function() {
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() { loader.style.display = 'none'; }, 300);
        }
      }, 500);
    };

    setTimeout(function() {
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() { loader.style.display = 'none'; }, 300);
      }
    }, 4500);

    function reloadGD() {
      if (loader) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
      }
      frame.src = engines[currentEngine].url;
    }

    function switchEngine() {
      currentEngine = (currentEngine + 1) % engines.length;
      if (label) label.textContent = engines[currentEngine].name;
      reloadGD();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
      } else {
        document.exitFullscreen().catch(function() {});
      }
    }
  </script>
</body>
</html>
