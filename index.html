<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      // Ensure trailing slash on GitHub Pages subdirectory URLs so relative paths resolve correctly
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.origin + path + '/' + window.location.search + window.location.hash);
        }
      })();

      (function() {
        // Suppress Vite HMR websocket noise in preview sandbox
        var origConsoleError = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).join(' ');
          if (msg.indexOf('[vite] failed to connect to websocket') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          var str = '' + (event && event.reason && (event.reason.message || event.reason.stack || event.reason));
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var str = '' + (event && (event.message || ''));
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
